<!DOCTYPE html>
<html>
<head>
    <title>Джерела доходів</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fa;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .add-button {
            display: inline-block;
            margin-bottom: 25px;
            padding: 8px 16px;
            background: #16a34a;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .transaction-card {
            background: white;
            border-radius: 10px;
            padding: 18px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);

            display: flex;
            justify-content: space-between;
            align-items: center;

            transition: transform 0.15s, box-shadow 0.15s;
        }

        .transaction-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        .transaction-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .transaction-category {
            font-weight: 600;
        }

        .transaction-comment {
            color: #64748b;
            font-size: 14px;
        }

        .transaction-date {
            font-size: 13px;
            color: #94a3b8;
        }

        .transaction-amount {
            font-size: 18px;
            font-weight: bold;
            color: #16a34a;
        }

    </style>

</head>

<body>

<header>

    <h1>Джерела доходів</h1>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/expense/">Витрати</a>
        <a href="/income/new/">Додати дохід</a>
    </nav>

</header>

<main>

    <h2>Усі доходи</h2>

    <a class="add-button" href="/income/new/">
        + Додати дохід
    </a>


    <div class="transaction-list">

        <#list incomes as income>

        <div class="transaction-card">

            <div class="transaction-info">

                <div class="transaction-category">
                    ${income.category}
                </div>

                <div class="transaction-comment">
                    ${income.comment!""}
                </div>

                <div class="transaction-date">
                    ${income.date}
                </div>

            </div>

            <div class="transaction-amount">
                +${income.amount} грн
            </div>

        </div>

    </#list>

    </div>

</main>

</body>
</html>
