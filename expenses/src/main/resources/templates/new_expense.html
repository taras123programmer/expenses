<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Нова витрата</title>
    <link rel="stylesheet" href="/css/styles.css">

    <style>


    </style>

</head>

<body>

<header>
    <h1>Нова витрата</h1>
</header>

<main class="form-layout">

    <div class="form-card">

        <h2>Додати витрату</h2>

        <form action="/expense/new/" method="post">
            <input type="hidden" name="regular" value="<#if regular?? && regular>true<#else>false</#if>">
            <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}">
            <div class="form-group">
                <label>Сума</label>
                <input type="number" name="amount" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Дата</label>
                <input type="date" name="date" value="${.now?string('yyyy-MM-dd')}" required>
            </div>

            <div class="form-group">
                <label>Категорія</label>
                <select name="categoryId">
                    <#list categories as c>
                        <option value="${c.id()}">${c.name()}</option>
                    </#list>
                </select>
            </div>

            <div class="form-group">
                <label>Коментар</label>
                <textarea name="comment" rows="3"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit">Зберегти</button>

                <button type="button"
                        class="secondary"
                        onclick="location.href='/'">
                    Скасувати
                </button>
            </div>

        </form>

    </div>

</main>

</body>
</html>
