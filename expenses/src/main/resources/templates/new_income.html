<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати джерело доходу</title>
    <link rel="stylesheet" href="/css/styles.css">

</head>

<body>

<header>
    <h1>Додати джерело доходу</h1>
</header>

<main class="form-layout">

    <div class="form-card">

        <h2>Додати нове джерело доходу</h2>

        <form method="post" action="">

            <div class="form-group">
                <label>Категорія</label>
                <select name="categoryId" required>
                    <#list categories as category>
                    <option value="${category.id()}">
                        ${category.name()}
                    </option>
                </#list>
                </select>
            </div>

            <div class="form-group">
                <label>Дата отримання:</label>
                <input type="date" name="date" value="${.now?string('yyyy-MM-dd')}" required>
            </div>

            <div class="form-group">
                <label>Сума</label>
                <input
                        type="number"
                        step="0.01"
                        name="amount"
                        required>
            </div>

            <div class="form-group checkbox-group">
                <input
                        type="checkbox"
                        name="regular"
                        value="true">

                <label>Регулярний(щомісячний) дохід</label>
            </div>

            <div class="form-group">
                <label>Коментар(необов'язково)</label>
                <input
                        type="text"
                        name="comment">
            </div>

            <div class="actions">
                <button type="submit">Зберегти</button>
                <a href="/" class="button secondary">Скасувати</a>
            </div>
            <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}">
        </form>
    </div>

</main>

</body>
</html>
